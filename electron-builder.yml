appId: com.m3rcena.udeler
productName: Udeler Reborn
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: udeler-reborn
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: appx
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  oneClick: true
  perMachine: false
portable:
  artifactName: ${name}-${version}-portable.${ext}
appx:
  artifactName: ${name}-${version}-store.${ext}
  applicationId: UdelerReborn
  identityName: ${env.MS_APPX_IDENTITY_NAME}
  publisherDisplayName: ${env.MS_APPX_PUBLISHER_DISPLAY_NAME}
  publisher: ${env.MS_APPX_PUBLISHER_ID}
  backgroundColor: 'transparent'
  showNameOnTiles: true
  languages:
    - en-US
    - el-GR
mac:
  identity: '-'
  notarize: false
  gatekeeperAssess: false
  hardenedRuntime: false
  icon: resources/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to save your course content.
    - NSDownloadsFolderUsageDescription: Application requests access to save your course content.
dmg:
  artifactName: ${name}-${version}.${ext}
  sign: false
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - snap
    - deb
    - rpm
    - tar.gz
  maintainer: M3rcena
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
rpm:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}.${ext}
snap:
  artifactName: ${name}-${version}.${ext}
  publish:
    provider: github
    owner: M3rcena
    repo: Udeler-Reborn
npmRebuild: false
publish:
  provider: github
  owner: M3rcena
  repo: Udeler-Reborn
